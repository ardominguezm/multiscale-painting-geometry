[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiscale-painting-geometry"
version = "1.0.0"
description = "Interpretable multiscale level-set geometry for computational art analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Andy Domínguez-Monterroza" }
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<1",
  "scikit-learn>=1.4,<2",
  "opencv-python-headless>=4.9,<5",
  "matplotlib>=3.8,<4",
  "Pillow>=10.2,<13",
  "tqdm>=4.66,<5",
  "ordpy>=1.2,<2",
  "Jinja2>=3.1,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["painting_geometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
